<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A configurable static contact page template with hero section, social links, and theming.">
  <meta name="theme-color" content="#0a0a0a">
  <title>Contact Template</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="content" role="main" aria-live="polite" aria-labelledby="contact-title">
    <div class="wrap" id="contact-root"></div>
    <noscript>
      <p class="noscript-tip">This page requires JavaScript to render contact information.</p>
    </noscript>
  </main>

  <script src="./js/config.js" defer></script>
  <script src="./js/icons.js" defer></script>
  <script src="./js/app.js" defer></script>
  <script src="./oneko.js" data-cat="image.png"></script>
</body>
</html>
